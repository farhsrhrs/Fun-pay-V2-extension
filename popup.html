<!DOCTYPE html>
<html>
<head>
  <meta charset="UTF-8">
  <style>
    :root {
      --bg: #1a1a2e;
      --card-bg: #16213e;
      --primary: #4ecca3;
      --accent: #0f3460;
      --text: #eeeeee;
      --red: #e94560;
      --blue: #3498db;
      --green: #2ecc71;
    }
    body { 
      width: 380px; 
      margin: 0;
      padding: 20px; 
      font-family: 'Inter', -apple-system, BlinkMacSystemFont, sans-serif; 
      background: var(--bg); 
      color: var(--text);
    }
    .container { display: flex; flex-direction: column; gap: 15px; }
    h2 { font-size: 16px; margin: 0 0 10px 0; color: var(--primary); text-transform: uppercase; letter-spacing: 1px; }
    
    .btn { 
      width: 100%; 
      padding: 12px; 
      cursor: pointer; 
      border: none; 
      border-radius: 8px; 
      color: white; 
      font-weight: 600;
      transition: all 0.2s cubic-bezier(0.4, 0, 0.2, 1);
      box-shadow: 0 4px 6px rgba(0,0,0,0.1);
    }
    .btn:active { transform: translateY(2px); }
    #parseFinances { background: var(--blue); }
    #parseOrders { background: var(--green); }

    /* Тогглы выбора */
    .toggle-btn {
      width: 100%;
      padding: 11px 12px;
      cursor: pointer;
      border: 1.5px solid rgba(78,204,163,0.35);
      border-radius: 8px;
      color: #bbb;
      font-weight: 600;
      font-size: 12px;
      background: rgba(78,204,163,0.05);
      transition: all 0.2s;
      display: flex;
      align-items: center;
      justify-content: flex-start;
      gap: 8px;
      box-sizing: border-box;
    }
    .toggle-btn:active { transform: translateY(2px); }
    
    #orderSelectorToggle.active {
      background: rgba(78,204,163,0.18);
      border-color: #4ecca3;
      color: #4ecca3;
    }
    #financeSelectorToggle {
      border-color: rgba(52, 152, 219, 0.35);
      background: rgba(52, 152, 219, 0.05);
    }
    #financeSelectorToggle.active {
      background: rgba(52, 152, 219, 0.2);
      border-color: #3498db;
      color: #3498db;
    }
    
    .lot-group { 
      padding: 15px; 
      background: var(--card-bg);
      border-radius: 12px;
      border: 1px solid rgba(255,255,255,0.1);
    }
    .lot-title { font-size: 12px; font-weight: bold; margin-bottom: 10px; color: #888; display: block; }
    .btn-row { display: flex; gap: 8px; margin-bottom: 12px; }
    .btn-small { 
      flex: 1; 
      padding: 10px; 
      border: none; 
      border-radius: 6px; 
      cursor: pointer; 
      color: white; 
      font-size: 11px; 
      font-weight: 700; 
      transition: opacity 0.2s;
    }
    .btn-on { background: var(--green); }
    .btn-off { background: var(--red); }
    .btn-time { 
      background: var(--accent); 
      padding: 6px; 
      font-size: 10px; 
      min-width: 35px;
      border: 1px solid rgba(255,255,255,0.1);
    }
    .btn-time:hover { background: var(--primary); color: var(--bg); }

    /* Results Table */
    #resultsContainer {
      margin-top: 10px;
      background: var(--card-bg);
      border-radius: 12px;
      overflow: hidden;
      border: 1px solid rgba(255,255,255,0.1);
      display: none;
    }
    .results-header {
      padding: 10px 15px;
      background: var(--accent);
      font-size: 11px;
      font-weight: bold;
      display: flex;
      justify-content: space-between;
      align-items: center;
    }
    table { width: 100%; border-collapse: collapse; font-size: 11px; }
    th { text-align: left; padding: 10px 15px; color: #888; font-weight: 500; border-bottom: 1px solid rgba(255,255,255,0.05); }
    td { padding: 10px 15px; border-bottom: 1px solid rgba(255,255,255,0.05); }
    
    .badge {
      padding: 2px 6px;
      border-radius: 4px;
      font-size: 9px;
      font-weight: bold;
      text-transform: uppercase;
    }
    .badge-lower { background: var(--red); color: white; }
    .badge-ours { background: var(--blue); color: white; border: 1px solid rgba(255,255,255,0.3); }
    .badge-higher { background: var(--green); color: white; }
    
    .price { font-weight: bold; color: var(--primary); }
    .seller { color: #ccc; max-width: 80px; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }

    #status { 
      margin-top: 15px; 
      font-size: 12px; 
      text-align: center; 
      color: #888; 
      font-style: italic;
    }
    
    .loading-spinner {
      display: none;
      width: 20px;
      height: 20px;
      border: 2px solid rgba(255,255,255,0.1);
      border-top-color: var(--primary);
      border-radius: 50%;
      animation: spin 1s linear infinite;
      margin: 10px auto;
    }
    @keyframes spin { to { transform: rotate(360deg); } }
  </style>
</head>
<body>
  <div class="container">
    <h2>FunPay Control</h2>
    
    <button id="parseFinances" class="btn">История финансов (Google)</button>
    <button id="parseOrders" class="btn">Заказы Trade (Google)</button>

    <div style="display: flex; flex-direction: column; gap: 8px;">
      <button id="orderSelectorToggle" class="toggle-btn">
        <span id="orderSelectorIcon">⚪</span> Выбор заказов (Продажи): ВЫКЛ
      </button>
      <button id="financeSelectorToggle" class="toggle-btn">
        <span id="financeSelectorIcon">⚪</span> Выбор финансов (Баланс): ВЫКЛ
      </button>
    </div>
  
    <div class="lot-group">
      <span class="lot-title">Управление лотами</span>
      <div class="btn-row" style="margin-bottom: 8px;">
        <button class="btn-small btn-on" id="onDiscord">ВКЛ Discord</button>
        <button class="btn-small btn-off" id="offDiscord">ВЫКЛ Discord</button>
      </div>
      <div class="btn-row">
        <button class="btn-small btn-on" id="onSpotify">ВКЛ Spotify</button>
        <button class="btn-small btn-off" id="offSpotify">ВЫКЛ Spotify</button>
      </div>
    </div>
    <div class="lot-group">
      <div style="display: flex; justify-content: space-between; align-items: center; margin-bottom: 10px;">
        <span class="lot-title" style="margin:0;">Мониторинг</span>
        <button id="scanAll" class="btn-small" style="background: #f39c12; flex: none; padding: 4px 8px;">Сканировать всё</button>
      </div>

      <span class="lot-title">Discord</span>
      <div class="btn-row">
        <button class="btn-small" style="background: #9b59b6;" id="trackNitro">Nitro</button>
        <button class="btn-small" style="background: #8e44ad;" id="trackNitroBasic">Nitro Basic</button>
      </div>

      <span class="lot-title">Spotify</span>
      <div class="btn-row" style="flex-wrap: wrap;">
        <button class="btn-small" style="background: #1DB954;" id="trackSpotifyIndividual">Individual</button>
        <button class="btn-small" style="background: #1DB954;" id="trackSpotifyDuo">Duo</button>
        <button class="btn-small" style="background: #1DB954;" id="trackSpotifyFamily">Family</button>
      </div>
    </div>

    <div class="lot-group" style="margin-top: 10px; background: rgba(243, 156, 18, 0.1);">
      <span class="lot-title">Авто-обновление</span>
      <div style="display: flex; align-items: center; gap: 10px; margin-bottom: 8px;">
        <label class="switch" style="display: flex; align-items: center; gap: 5px; font-size: 11px; cursor: pointer;">
          <input type="checkbox" id="autoUpdateToggle"> <span style="font-weight: bold;">Включить</span>
        </label>
        <input type="number" id="updateInterval" value="5" min="1" style="width: 40px; background: #0f3460; color: white; border: 1px solid #333; padding: 2px; border-radius: 4px; font-size: 11px;">
        <span style="font-size: 11px; color: #888;">мин.</span>
      </div>
      <div class="btn-row" style="margin: 0; gap: 4px;">
        <button class="btn-small btn-time" data-time="1">1м</button>
        <button class="btn-small btn-time" data-time="5">5м</button>
        <button class="btn-small btn-time" data-time="10">10м</button>
        <button class="btn-small btn-time" data-time="30">30м</button>
        <button class="btn-small btn-time" data-time="60">1ч</button>
      </div>
    </div>

    <div class="loading-spinner" id="loader"></div>

    <div id="resultsWrapper" style="display: none; margin-top: 15px;">
      <div class="results-header" style="margin-bottom: 10px;">
        <span style="font-weight: bold; color: var(--accent);">СВОДКА ПО ВСЕМ ЛОТАМ</span>
        <div style="display: flex; gap: 12px; align-items: center;">
          <span id="openFunPay" style="cursor: pointer; color: var(--primary); font-size: 10px; border-bottom: 1px dashed var(--primary);">Открыть сайт</span>
          <span id="clearResults" style="cursor: pointer; color: #888;">Очистить всё</span>
        </div>
      </div>
      <div id="resultsList">
        <!-- Сюда будут добавляться таблицы для каждого лота -->
      </div>
    </div>

    <div class="lot-group" style="margin-top: 10px;">
      <span class="lot-title">Настройки (Ваши лоты)</span>
      <div style="display: flex; flex-direction: column; gap: 8px;">
        <input type="text" id="urlNitro" placeholder="URL Nitro (Edit)" style="width: 100%; padding: 6px; border-radius: 4px; border: 1px solid #333; background: #0f3460; color: white; font-size: 9px;">
        <input type="text" id="urlNitroBasic" placeholder="URL Nitro Basic (Edit)" style="width: 100%; padding: 6px; border-radius: 4px; border: 1px solid #333; background: #0f3460; color: white; font-size: 9px;">
        <input type="text" id="urlSpotifyIndividual" placeholder="URL Spotify Individual (Edit)" style="width: 100%; padding: 6px; border-radius: 4px; border: 1px solid #333; background: #0f3460; color: white; font-size: 9px;">
        <input type="text" id="urlSpotifyDuo" placeholder="URL Spotify Duo (Edit)" style="width: 100%; padding: 6px; border-radius: 4px; border: 1px solid #333; background: #0f3460; color: white; font-size: 9px;">
        <input type="text" id="urlSpotifyFamily" placeholder="URL Spotify Family (Edit)" style="width: 100%; padding: 6px; border-radius: 4px; border: 1px solid #333; background: #0f3460; color: white; font-size: 9px;">
        <button id="saveUrls" class="btn-small" style="background: var(--accent); width: 100%;">Сохранить настройки</button>
      </div>
    </div>
  
    <div id="status">Готов к работе</div>
  </div>
  <script src="popup.js"></script>
</body>
</html>
